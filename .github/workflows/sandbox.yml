name: AAIF sandbox compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_proofs:
        description: Run the real o1js application-proof profile
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  identity-and-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run tck:validate
      - run: npm run test:sandbox
      - run: npm run tck:idjag
  application-proofs:
    if: github.event_name == 'workflow_dispatch' && inputs.real_proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run tck:proofs
